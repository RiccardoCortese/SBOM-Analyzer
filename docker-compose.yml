services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    env_file:
      - ./Backend/.env

    ports:
      - "9000:9000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    environment:
      BACKEND_URL: http://backend:9000

    ports:
      - "9501:9501"

    depends_on:
      - backend