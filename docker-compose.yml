services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    env_file:
      - ./Backend/.env

    ports:
      - "8000:8000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    environment:
      BACKEND_URL: http://backend:8000

    ports:
      - "8501:8501"

    depends_on:
      - backend