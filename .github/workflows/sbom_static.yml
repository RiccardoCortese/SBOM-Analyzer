name: Automated Multi-Tool SBOM Analysis

on:
  workflow_dispatch:
    inputs:
      src_repository:
        description: 'Source Repository (owner/repo o URL)'
        required: true
      src_branch:
        description: 'Branch'
        required: false
        default: 'main'
      format:
        description: 'Format (requirements, poetry, uv, maven, gradle, entrambi)'
        required: false
        default: 'entrambi'
  repository_dispatch:
    types: [run_sbom_analysis]

permissions:
  contents: read

env:
  SRC_REPO: ${{ github.event.client_payload.target_repository || inputs.src_repository }}
  SRC_BRANCH: ${{ github.event.client_payload.target_branch || inputs.src_branch || 'main' }}
  FORMAT_TYPE: ${{ github.event.client_payload.format || inputs.format || 'entrambi' }}
  OUTPUT_DIR: 'sbom_outputs/static'

jobs:
  sbom-analysis:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Target Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ env.SRC_REPO }}
        ref: ${{ env.SRC_BRANCH }}
        path: repo_esterna
    

        
    - name: Detect Required Python Version
      id: detect-python
      run: |
        VERSION="3.12" # Default di fallback
        
        # Cerca pyproject.toml
        TOML_PATH=$(find "$(pwd)/repo_esterna" -name "pyproject.toml" | head -n 1)
        if [ -f "$TOML_PATH" ]; then
          # Estrae la prima occorrenza di X.Y che segue requires-python
          VERSION=$(grep "requires-python" "$TOML_PATH" | grep -oE "[0-9]+\.[0-9]+" | head -n 1)
          echo "Versione rilevata da TOML: $VERSION"
        
        # Se non c'è TOML, cerca runtime.txt (spesso presente in repo che usano requirements.txt)
        elif [ -f "$(pwd)/repo_esterna/runtime.txt" ]; then
          VERSION=$(grep -oE "[0-9]+\.[0-9]+" "$(pwd)/repo_esterna/runtime.txt" | head -n 1)
          echo "Versione rilevata da runtime.txt: $VERSION"
        
        else
          echo "Nessuna versione specifica trovata, uso default 3.12"
        fi
        
        echo "python_ver=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.detect-python.outputs.python_ver }}

    - name: Install tools
      run: |
        pip install uv 
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

    # ============================================================
    # ESECUZIONE POETRY 
    # ============================================================
    - name: Process Poetry SBOMs
      if: ${{ env.FORMAT_TYPE == 'poetry' || env.FORMAT_TYPE == 'entrambi' }}
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        TOML_PATH=$(find "$(pwd)/repo_esterna" -name "pyproject.toml" | head -n 1)
        if [ -n "$TOML_PATH" ]; then
          DIR_PATH=$(dirname "$TOML_PATH")
          
          # Tentativo robusto di lock
          cd "$DIR_PATH"
          # Usiamo uv per risolvere le dipendenze invece di poetry, 
          # è molto più tollerante con le versioni Python
          uv lock || echo "Il lock automatico è fallito, procedo con il file esistente..."
          cd -
          
          trivy fs --format cyclonedx --output ${{ env.OUTPUT_DIR }}/trivy_poetry.json "$DIR_PATH"
        
        else
          echo "Skipping Poetry: pyproject.toml non trovato."
        fi

    # ============================================================
    #  ESECUZIONE REQUIREMENTS 
    # ============================================================
    - name: Process Requirements SBOMs
      if: ${{ env.FORMAT_TYPE == 'requirements' || env.FORMAT_TYPE == 'entrambi' }}
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        REQ_PATH=$(find "$(pwd)/repo_esterna" -name "requirements.txt" | head -n 1)
        if [ -n "$REQ_PATH" ]; then
          trivy fs --format cyclonedx --output ${{ env.OUTPUT_DIR }}/trivy_requirements.json $REQ_PATH
          
        else
          echo "Skipping Requirements: requirements.txt non trovato."
        fi
    
    # ============================================================
    # ESECUZIONE UV
    # ============================================================
    - name: Process Python Lockfiles (UV)
      if: ${{ env.FORMAT_TYPE == 'uv' || env.FORMAT_TYPE == 'entrambi' }}
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        
        LOCK_FILE=$(find "$(pwd)/repo_esterna" -name "uv.lock" | head -n 1)
        
        if [ -n "$LOCK_FILE" ]; then
          echo "File di lock trovato: $LOCK_FILE"
          trivy fs --format cyclonedx --output ${{ env.OUTPUT_DIR }}/trivy_uv.json "$LOCK_FILE"
        else
          echo "Nessun file di lock (uv.lock/poetry.lock) trovato."
        fi

    # ============================================================
    # RILEVAMENTO VERSIONE JAVA DAL POM.XML
    # ============================================================
    - name: Detect Java Version
      id: detect-java
      if: ${{ env.FORMAT_TYPE == 'maven' || env.FORMAT_TYPE == 'entrambi' }}
      run: |
        POM_PATH="repo_esterna/pom.xml"

        if [ ! -f "$POM_PATH" ]; then
          POM_PATH=$(find "$(pwd)/repo_esterna" -name "pom.xml" -not -path "*/target/*" | head -n 1)
        fi

        # Versione predefinita per eseguire Maven
        FALLBACK_VERSION="17"
        PROJECT_VERSION=""

        if [ -n "$POM_PATH" ] && [ -f "$POM_PATH" ]; then
          echo "Rilevamento versione Java da: $POM_PATH"

          PROJECT_VERSION=$(python - "$POM_PATH" << 'EOF_PY'
        import sys
        import re
        import xml.etree.ElementTree as ET

        pom_path = sys.argv[1]

        try:
            root = ET.parse(pom_path).getroot()
        except (ET.ParseError, OSError) as exc:
            print(f"Errore nella lettura del pom.xml: {exc}", file=sys.stderr)
            sys.exit(0)

        def local_name(tag):
            return tag.split("}")[-1]

        def find_child(element, name):
            if element is None:
                return None
            for child in element:
                if local_name(child.tag) == name:
                    return child
            return None

        def child_text(element, name):
            child = find_child(element, name)
            return child.text.strip() if child is not None and child.text else None

        properties = find_child(root, "properties")
        property_values = {}

        if properties is not None:
            for child in properties:
                property_values[local_name(child.tag)] = (
                    child.text.strip() if child.text else ""
                )

        def resolve(value, depth=0):
            if not value or depth > 10:
                return value

            pattern = re.compile(r"\$\{([^}]+)\}")
            return pattern.sub(
                lambda match: resolve(
                    property_values.get(match.group(1), match.group(0)),
                    depth + 1
                ),
                value
            )

        candidates = []

        build = find_child(root, "build")
        plugins = find_child(build, "plugins")

        if plugins is not None:
            for plugin in plugins:
                if child_text(plugin, "artifactId") != "maven-compiler-plugin":
                    continue

                configuration = find_child(plugin, "configuration")
                if configuration is not None:
                    for field in ("release", "target", "source"):
                        value = child_text(configuration, field)
                        if value:
                            candidates.append((field, resolve(value)))

        for field in (
            "maven.compiler.release",
            "maven.compiler.target",
            "maven.compiler.source",
            "java.version",
            "jdk.version"
        ):
            value = property_values.get(field)
            if value:
                candidates.append((field, resolve(value)))

        for field, value in candidates:
            if not value:
                continue

            value = value.strip()

            match = re.fullmatch(r"(?:1\.)?(\d+)(?:\.0)?", value)
            if match:
                version = int(match.group(1))
                if version >= 5:
                    print(version)
                    sys.exit(0)

        print("")
        EOF_PY
        )

        else
          echo "Nessun pom.xml trovato."
        fi

        # Se la versione rilevata è utilizzabile, la usa per Maven.
        if [[ "$PROJECT_VERSION" =~ ^[0-9]+$ ]] && [ "$PROJECT_VERSION" -ge 8 ]; then
          JAVA_VERSION="$PROJECT_VERSION"
          echo "Versione Java del progetto: $PROJECT_VERSION"
          echo "Uso Java $JAVA_VERSION per Maven."
        else
          JAVA_VERSION="$FALLBACK_VERSION"
          if [ -n "$PROJECT_VERSION" ]; then
            echo "Java $PROJECT_VERSION dichiarata dal progetto, non utilizzabile nel setup standard."
          else
            echo "Versione Java non rilevata."
          fi
          echo "Uso Java $JAVA_VERSION come fallback per Maven."
        fi

        echo "project_java_version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
        echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
        
    - name: Setup Java
      if: ${{ env.FORMAT_TYPE == 'maven' || env.FORMAT_TYPE == 'entrambi' }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ steps.detect-java.outputs.java_version }}
        cache: maven

    - name: Process Maven SBOMs
      if: ${{ env.FORMAT_TYPE == 'maven' || env.FORMAT_TYPE == 'entrambi' }}
      run: |
        mkdir -p "${{ env.OUTPUT_DIR }}"

        POM_PATH="repo_esterna/pom.xml"

        if [ ! -f "$POM_PATH" ]; then
          POM_PATH=$(find "$(pwd)/repo_esterna" -name "pom.xml" -not -path "*/target/*" | head -n 1)
        fi

        if [ -n "$POM_PATH" ] && [ -f "$POM_PATH" ]; then
          echo "pom.xml trovato: $POM_PATH"
          DIR_PATH=$(dirname "$POM_PATH")

          cd "$DIR_PATH"
          # Generazione nativa tramite il plugin CycloneDX Maven
          mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -Dcyclonedx.skip=false

          # Individua il file generato (di default target/bom.json o target/cyclonedx/bom.json)
          if [ -f "target/bom.json" ]; then
            cp target/bom.json "${{ github.workspace }}/${{ env.OUTPUT_DIR }}/trivy_maven.json"
          elif [ -f "target/cyclonedx/bom.json" ]; then
            cp target/cyclonedx/bom.json "${{ github.workspace }}/${{ env.OUTPUT_DIR }}/trivy_maven.json"
          else
            # Fallback generico se la struttura varia
            find target -name "bom.json" -exec cp {} "${{ github.workspace }}/${{ env.OUTPUT_DIR }}/trivy_maven.json" \;
          fi
          cd -
        else
          echo "Skipping Maven: pom.xml non trovato."
        fi

    # ============================================================
    # ESECUZIONE GRADLE - CYCLONEDX
    # ============================================================
    - name: Detect Gradle, Java and CycloneDX Version
      id: detect-gradle-java
      if: ${{ env.FORMAT_TYPE == 'gradle' || env.FORMAT_TYPE == 'entrambi' }}
      run: |
        GRADLE_PROPERTIES=$(find "$(pwd)/repo_esterna" \
          -path "*/gradle/wrapper/gradle-wrapper.properties" \
          -not -path "*/build/*" \
          | head -n 1)

        if [ -z "$GRADLE_PROPERTIES" ]; then
          echo "Gradle Wrapper non trovato."
          echo "Uso fallback: Java 17 / CycloneDX 3.4.1"

          echo "gradle_version=unknown" >> "$GITHUB_OUTPUT"
          echo "java_version=17" >> "$GITHUB_OUTPUT"
          echo "cyclonedx_version=3.4.1" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Gradle wrapper properties: $GRADLE_PROPERTIES"

        GRADLE_VERSION=$(grep '^distributionUrl=' "$GRADLE_PROPERTIES" \
          | sed -E 's/.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-.*/\1/')

        if [ -z "$GRADLE_VERSION" ]; then
          echo "Impossibile rilevare la versione Gradle."
          exit 1
        fi

        echo "Versione Gradle rilevata: $GRADLE_VERSION"

        GRADLE_MAJOR=$(echo "$GRADLE_VERSION" | cut -d. -f1)
        GRADLE_MINOR=$(echo "$GRADLE_VERSION" | cut -d. -f2)

        JAVA_VERSION=""
        CYCLONEDX_VERSION=""

        # =====================================================
        # Gradle < 7.3
        # Java 11
        # CycloneDX 1.6.1
        # =====================================================
        if [ "$GRADLE_MAJOR" -lt 7 ] || \
           { [ "$GRADLE_MAJOR" -eq 7 ] && [ "$GRADLE_MINOR" -lt 3 ]; }; then

          JAVA_VERSION="11"
          CYCLONEDX_VERSION="1.6.1"

        # =====================================================
        # Gradle 7.3 - 7.x
        # Java 17
        # CycloneDX 1.6.1
        # =====================================================
        elif [ "$GRADLE_MAJOR" -eq 7 ]; then

          JAVA_VERSION="17"
          CYCLONEDX_VERSION="1.6.1"

        # =====================================================
        # Gradle 8.0 - 8.3
        # Java 17
        # CycloneDX 2.4.1
        # =====================================================
        elif [ "$GRADLE_MAJOR" -eq 8 ] && [ "$GRADLE_MINOR" -lt 4 ]; then

          JAVA_VERSION="17"
          CYCLONEDX_VERSION="2.4.1"

        # =====================================================
        # Gradle 8.4 - 8.x
        # Java 17
        # CycloneDX 3.4.1
        # =====================================================
        elif [ "$GRADLE_MAJOR" -eq 8 ]; then

          JAVA_VERSION="17"
          CYCLONEDX_VERSION="3.4.1"

        # =====================================================
        # Gradle 9.0.x
        # Java 21
        # CycloneDX 3.4.1
        # =====================================================
        elif [ "$GRADLE_MAJOR" -eq 9 ] && [ "$GRADLE_MINOR" -lt 1 ]; then

          JAVA_VERSION="21"
          CYCLONEDX_VERSION="3.4.1"

        # =====================================================
        # Gradle 9.1+
        # Java 25
        # CycloneDX 3.4.1
        # =====================================================
        else

          JAVA_VERSION="25"
          CYCLONEDX_VERSION="3.4.1"

        fi

        echo ""
        echo "=========================================="
        echo "Configurazione Gradle rilevata"
        echo "=========================================="
        echo "Gradle:    $GRADLE_VERSION"
        echo "Java:      $JAVA_VERSION"
        echo "CycloneDX: $CYCLONEDX_VERSION"
        echo "=========================================="
        echo ""

        echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
        echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
        echo "cyclonedx_version=$CYCLONEDX_VERSION" >> "$GITHUB_OUTPUT"
    - name: Setup Java for Gradle
      if: ${{ env.FORMAT_TYPE == 'gradle' || env.FORMAT_TYPE == 'entrambi' }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ steps.detect-gradle-java.outputs.java_version }}

    - name: Process Gradle SBOMs
      if: ${{ env.FORMAT_TYPE == 'gradle' || env.FORMAT_TYPE == 'entrambi' }}
      run: |
        mkdir -p "${{ env.OUTPUT_DIR }}"

        # Cerca il build.gradle/build.gradle.kts del progetto.
        # Prima prova nella root del repository.
        GRADLE_PATH=""

        if [ -f "repo_esterna/build.gradle" ]; then
          GRADLE_PATH="repo_esterna/build.gradle"
        elif [ -f "repo_esterna/build.gradle.kts" ]; then
          GRADLE_PATH="repo_esterna/build.gradle.kts"
        else
          GRADLE_PATH=$(find "$(pwd)/repo_esterna" \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "*/build/*" \
            | head -n 1)
        fi

        if [ -n "$GRADLE_PATH" ] && [ -f "$GRADLE_PATH" ]; then

          echo "File Gradle trovato: $GRADLE_PATH"

          DIR_PATH=$(dirname "$GRADLE_PATH")
          echo "Directory progetto Gradle: $DIR_PATH"

          cd "$DIR_PATH"

          # ======================================================
          # Cerca il Gradle Wrapper
          # ======================================================

          GRADLE_CMD=""

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper trovato."
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          elif [ -f "../gradlew" ]; then
            echo "Gradle Wrapper trovato nella directory padre."
            chmod +x ../gradlew
            GRADLE_CMD="../gradlew"
          elif command -v gradle >/dev/null 2>&1; then
            echo "Gradle Wrapper non trovato. Uso Gradle installato sul runner."
            GRADLE_CMD="gradle"
          else
            echo "ERRORE: Gradle non trovato."
            exit 1
          fi

          echo "Gradle command: $GRADLE_CMD"

          # ======================================================
          # Crea initialization script CycloneDX
          #
          # CycloneDX 3.x supporta Gradle 8.4+
          # ======================================================

          printf '%s\n' \
            'initscript {' \
            '    repositories {' \
            '        gradlePluginPortal()' \
            '    }' \
            '    dependencies {' \
            '        classpath "org.cyclonedx.bom:org.cyclonedx.bom.gradle.plugin:${{ steps.detect-gradle-java.outputs.cyclonedx_version }}"' \
            '    }' \
            '}' \
            '' \
            'rootProject {' \
            '    apply plugin: "org.cyclonedx.bom"' \
            '}' \
            > /tmp/init-cyclonedx.gradle

          echo "Initialization script CycloneDX:"
          cat /tmp/init-cyclonedx.gradle

          # ======================================================
          # Generazione SBOM
          # ======================================================

          echo "Generazione SBOM CycloneDX..."

          "$GRADLE_CMD" cyclonedxBom \
            --init-script /tmp/init-cyclonedx.gradle \
            --no-daemon

          # ======================================================
          # Recupero SBOM aggregato
          # ======================================================

          OUTPUT_FILE="${{ github.workspace }}/${{ env.OUTPUT_DIR }}/trivy_gradle.json"

          if [ -f "build/reports/cyclonedx/bom.json" ]; then

            echo "SBOM aggregato trovato:"
            echo "build/reports/cyclonedx/bom.json"

            cp \
              "build/reports/cyclonedx/bom.json" \
              "$OUTPUT_FILE"

          else

            echo "SBOM aggregato non trovato nel percorso standard."

            BOM_FILE=$(find . \
              -path "*/build/reports/cyclonedx/bom.json" \
              -not -path "*/build/*/build/*" \
              | head -n 1)

            if [ -n "$BOM_FILE" ] && [ -f "$BOM_FILE" ]; then

              echo "SBOM trovato: $BOM_FILE"

              cp "$BOM_FILE" "$OUTPUT_FILE"

            else

              echo "ERRORE: nessun bom.json CycloneDX trovato."
              exit 1

            fi
          fi

          echo "SBOM Gradle generato:"
          ls -lh "$OUTPUT_FILE"

          cd -

        else
          echo "Skipping Gradle: build.gradle/build.gradle.kts non trovato."
        fi

    # ============================================================
    # CARICAMENTO RISULTATI COMPLETI
    # ============================================================
    - name: Upload SBOM results
      uses: actions/upload-artifact@v4
      with:
        name: sbom-static-results
        path: |
          ${{ env.OUTPUT_DIR }}/*.json